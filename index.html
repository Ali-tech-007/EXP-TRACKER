var RATE_TTL = 6*60*60*1000; // 6 hours

function catInfo(id){ return CATEGORIES.find(function(c){return c.id===id;}) || CATEGORIES[CATEGORIES.length-1]; }
function curInfo(code){ return CURRENCIES.find(function(c){return c.code===code;}) || {code:code,name:code,symbol:code}; }

/* ============ STATE ============ */
var defaultState = function(){
  return {
    settings:{ baseCurrency:'USD', theme:'dark', budgets:{}, pinned:['EUR','GBP','AED','PKR','AFN','INR'] },
    expenses:[],
    recurring:[],
    ratesCache:null
  };
};
var state = loadState();

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    return {
      settings:Object.assign({}, d.settings, parsed.settings||{}),
      expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [],
      recurring: Array.isArray(parsed.recurring) ? parsed.recurring : [],
      ratesCache: parsed.ratesCache || null
    };
  }catch(e){ console.warn('Could not load saved data, starting fresh.', e); return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Could not save data', e); showToast('⚠️ Could not save — storage may be full'); }
}

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
}

/* ============ DATES ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function currentMonthKey(){ return todayStr().slice(0,7); }
function monthLabel(key){
  if(!key) return '';
  var parts = key.split('-'); var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
  return d.toLocaleDateString(undefined,{month:'long', year:'numeric'});
}
function lastNMonthKeys(n){
  var out=[]; var d=new Date();
  for(var i=n-1;i>=0;i--){
    var dt = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'));
  }
  return out;
}

/* ============ MONEY / RATES ============ */
function formatMoney(amount, code){
  if(amount==null || isNaN(amount)) return '—';
  try{
    return new Intl.NumberFormat(undefined,{style:'currency', currency:code, maximumFractionDigits:2}).format(amount);
  }catch(e){
    var c = curInfo(code);
    return c.symbol + amount.toFixed(2);
  }
}
function ratesValid(){
  return state.ratesCache && state.ratesCache.base===state.settings.baseCurrency &&
    (Date.now() - state.ratesCache.fetchedAt) < RATE_TTL*4; // keep stale cache usable offline, just flagged
}
function ratesFresh(){
  return state.ratesCache && state.ratesCache.base===state.settings.baseCurrency &&
    (Date.now() - state.ratesCache.fetchedAt) < RATE_TTL;
}
function rateOf(code){
  if(!state.ratesCache) return null;
  if(code===state.ratesCache.base) return 1;
  var r = state.ratesCache.rates[code];
  return (typeof r==='number') ? r : null;
}
function convert(amount, from, to){
  if(from===to) return amount;
  var rf = rateOf(from), rt = rateOf(to);
  if(rf==null || rt==null) return null;
  var inBase = amount / rf;
  return inBase * rt;
}
function toBase(amount, from){ return convert(amount, from, state.settings.baseCurrency); }

async function fetchRates(base){
  try{
    var res = await fetch('https://open.er-api.com/v6/latest/'+encodeURIComponent(base));
    var data = await res.json();
    if(data && data.result==='success' && data.rates){
      state.ratesCache = { base:base, rates:data.rates, fetchedAt:Date.now() };
      saveState();
      return true;
    }
  }catch(e){ console.warn('Exchange rate fetch failed', e); }
  return false;
}
async function ensureRates(force){
  if(!force && ratesFresh()) { renderRateStatus(); return; }
  renderRateStatus(true);
  var ok = await fetchRates(state.settings.baseCurrency);
  if(!ok && !state.ratesCache){
    showToast('⚠️ Could not reach exchange rate service — check your connection');
  } else if(!ok){
    showToast('⚠️ Using last known rates (offline)');
  } else {
    showToast('✅ Exchange rates updated');
  }
  renderAll();
}

/* ============ TOAST ============ */
var toastTimer=null;
function showToast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

function fillCurrencySelect(sel, selected){
  sel.innerHTML='';
  CURRENCIES.forEach(function(c){
    var o=document.createElement('option');
    o.value=c.code; o.textContent = c.code+' — '+c.name+' ('+c.symbol+')';
    if(c.code===selected) o.selected=true;
    sel.appendChild(o);
  });
}
function fillCategorySelect(sel, selected, withAll){
  sel.innerHTML='';
  if(withAll){ var a=document.createElement('option'); a.value=''; a.textContent='All categories'; sel.appendChild(a); }
  CATEGORIES.forEach(function(c){
    var o=document.createElement('option');
    o.value=c.id; o.textContent=c.icon+' '+c.label;
    if(c.id===selected) o.selected=true;
    sel.appendChild(o);
  });
}
var pickers = {};
function buildCurrencyPicker(wrapperId, opts){
  opts = opts || {};
  var wrapper = document.getElementById(wrapperId);
  wrapper.classList.add('ccy-picker');
  wrapper.dataset.value = opts.value || 'USD';
  wrapper.innerHTML =
    '<button type="button" class="ccy-trigger"><span class="lbl"></span><span class="arrow">▾</span></button>'+
    '<div class="ccy-panel">'+
      '<input type="text" class="ccy-search" placeholder="Search code or country…" autocomplete="off" inputmode="search">'+
      '<div class="ccy-list" role="listbox"></div>'+
    '</div>';
  var trigger = wrapper.querySelector('.ccy-trigger');
  var triggerLbl = wrapper.querySelector('.ccy-trigger .lbl');
  var search = wrapper.querySelector('.ccy-search');
  var list = wrapper.querySelector('.ccy-list');

  function renderTrigger(){
    var c = curInfo(wrapper.dataset.value);
    triggerLbl.textContent = c.code+' — '+c.name+' ('+c.symbol+')';
  }
  function renderList(filter){
    var q=(filter||'').trim().toLowerCase();
    var items = !q ? CURRENCIES : CURRENCIES.filter(function(c){
      return c.code.toLowerCase().indexOf(q)>-1 || c.name.toLowerCase().indexOf(q)>-1;
    });
    if(items.length===0){ list.innerHTML='<div class="ccy-empty">No matching currency</div>'; return; }
    list.innerHTML = items.map(function(c){
      return '<div class="ccy-item" data-code="'+c.code+'"><span class="ccy-code">'+c.code+'</span>'+
        '<span class="ccy-name">'+c.name+'</span><span class="ccy-sym">'+c.symbol+'</span></div>';
    }).join('');
  }
  function openPanel(){
    document.querySelectorAll('.ccy-picker.open').forEach(function(p){ if(p!==wrapper) p.classList.remove('open'); });
    wrapper.classList.add('open');
    search.value=''; renderList('');
    setTimeout(function(){ search.focus(); }, 30);
  }
  function closePanel(){ wrapper.classList.remove('open'); }
  trigger.addEventListener('click', function(e){
    e.stopPropagation();
    wrapper.classList.contains('open') ? closePanel() : openPanel();
  });
  search.addEventListener('input', function(){ renderList(search.value); });
  search.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ closePanel(); trigger.focus(); }
    if(e.key==='Enter'){ e.preventDefault(); var first=list.querySelector('.ccy-item'); if(first) first.click(); }
  });
  list.addEventListener('click', function(e){
    var item = e.target.closest('.ccy-item');
    if(!item) return;
    wrapper.dataset.value = item.dataset.code;
    renderTrigger(); closePanel();
    if(opts.onChange) opts.onChange(item.dataset.code);
  });
  renderTrigger();
  return {
    get:function(){ return wrapper.dataset.value; },
    set:function(code){ wrapper.dataset.value=code; renderTrigger(); }
  };
}
document.addEventListener('click', function(e){
  document.querySelectorAll('.ccy-picker.open').forEach(function(p){
    if(!p.contains(e.target)) p.classList.remove('open');
  });
});
function fillCurrencyFilter(sel){
  sel.innerHTML='<option value="">All currencies</option>';
  var used = Array.from(new Set(state.expenses.map(function(e){return e.currency;})));
  used.sort();
  used.forEach(function(code){
    var o=document.createElement('option'); o.value=code; o.textContent=code; sel.appendChild(o);
  });
}
function fillMonthFilter(sel, includeAllOpt){
  var cur = sel.value;
  var months = Array.from(new Set(state.expenses.map(function(e){return monthKey(e.date);}))).sort().reverse();
  sel.innerHTML='';
  if(includeAllOpt){ var a=document.createElement('option'); a.value=''; a.textContent='All time'; sel.appendChild(a); }
  months.forEach(function(m){
    var o=document.createElement('option'); o.value=m; o.textContent=monthLabel(m); sel.appendChild(o);
  });
  if(!includeAllOpt && !months.includes(cur)){ cur = months[0] || currentMonthKey(); }
  if(Array.from(sel.options).some(function(o){return o.value===cur;})) sel.value = cur;
  else if(!includeAllOpt && sel.options.length===0){
    var o=document.createElement('option'); o.value=currentMonthKey(); o.textContent=monthLabel(currentMonthKey()); sel.appendChild(o);
  }
}

/* ============ TICKER ============ */
function renderTicker(){
  var inner = document.getElementById('tickerInner');
  var base = state.settings.baseCurrency;
  var pinned = state.settings.pinned.filter(function(c){ return c!==base; });
  var html = '';
  pinned.forEach(function(code){
    var r = rateOf(code);
    html += '<div class="tflap"><span class="code">'+base+' → '+code+'</span><span class="rate mono">'+(r!=null? r.toFixed(4) : '—')+'</span></div>';
  });
  var meta = '<span class="ticker-meta">';
  if(state.ratesCache && state.ratesCache.base===base){
    var mins = Math.round((Date.now()-state.ratesCache.fetchedAt)/60000);
    meta += (ratesFresh() ? 'updated '+ (mins<1?'just now':mins+'m ago') : 'stale ('+mins+'m ago)');
  } else { meta += 'fetching rates…'; }
  meta += ' <button id="tickerRefresh">refresh</button></span>';
  inner.innerHTML = html + meta;
  var btn = document.getElementById('tickerRefresh');
  if(btn) btn.addEventListener('click', function(){ ensureRates(true); });
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  var base = state.settings.baseCurrency;
  var total=0, totalOk=true, monthTotal=0, monthOk=true;
  var mk = currentMonthKey();
  var monthDays = new Set();
  state.expenses.forEach(function(e){
    var c = toBase(e.amount, e.currency);
    if(c==null) totalOk=false; else total += c;
    if(monthKey(e.date)===mk){
      if(c==null) monthOk=false; else monthTotal += c;
      monthDays.add(e.date);
    }
  });
  document.getElementById('statTotal').textContent = (ratesValid()||state.expenses.length===0) ? formatMoney(total, base) + (totalOk?'':' *') : 'Fetching rates…';
  document.getElementById('statMonthLbl').textContent = monthLabel(mk);
  document.getElementById('statMonth').textContent = (ratesValid()||state.expenses.length===0) ? formatMoney(monthTotal, base) : '—';
  var dayOfMonth = new Date().getDate();
  document.getElementById('statAvg').textContent = ratesValid() ? formatMoney(monthTotal/dayOfMonth, base) : '—';
  document.getElementById('statCount').textContent = state.expenses.length;

  renderConverter();
  renderDue();
  renderBudgets(document.getElementById('budgetCard'), false);
}

/* ============ CONVERTER ============ */
function renderConverter(){
  var amt = parseFloat(document.getElementById('cvAmount').value)||0;
  var from = pickers.cvFrom.get();
  var to = pickers.cvTo.get();
  var res = convert(amt, from, to);
  var out = document.getElementById('cvResult');
  var sub = document.getElementById('cvSub');
  if(res==null){
    out.childNodes[0].nodeValue = '—';
    sub.textContent = ratesFresh()===false && !state.ratesCache ? 'Waiting for rates…' : 'Rate unavailable for this pair';
  } else {
    out.childNodes[0].nodeValue = formatMoney(res, to) + ' ';
    sub.textContent = '1 '+from+' = '+ (convert(1,from,to)!=null? convert(1,from,to).toFixed(4):'—') +' '+to + (ratesFresh()? '' : '  (cached rate)');
  }
}

/* ============ RECURRING ============ */
function renderDue(){
  var mk = currentMonthKey();
  var card = document.getElementById('dueCard');
  var active = state.recurring;
  var due = active.filter(function(t){
    return !state.expenses.some(function(e){ return e.recurringId===t.id && monthKey(e.date)===mk; });
  });
  document.getElementById('dueCountHint').textContent = due.length ? due.length+' due' : 'all caught up';
  if(active.length===0){
    card.innerHTML = '<div class="empty"><span class="ic">🔁</span>No recurring expenses set up yet. Add one in Settings — like rent or a subscription.</div>';
    return;
  }
  if(due.length===0){
    card.innerHTML = '<div class="empty"><span class="ic">✅</span>Nothing due this month.</div>';
    return;
  }
  card.innerHTML='';
  due.forEach(function(t){
    var row = document.createElement('div');
    row.className='due-item';
    var ci = catInfo(t.category);
    row.innerHTML = '<div><strong>'+ci.icon+' '+escapeHtml(t.description)+'</strong><div class="helptext">'+formatMoney(t.amount,t.currency)+' · day '+t.dayOfMonth+' of month</div></div>';
    var btn = document.createElement('button');
    btn.className='btn sm primary'; btn.textContent='Log it';
    btn.addEventListener('click', function(){ logRecurring(t); });
    row.appendChild(btn);
    card.appendChild(row);
  });
}
function logRecurring(t){
  var d = new Date();
  var day = Math.min(t.dayOfMonth, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate());
  var dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  state.expenses.push({
    id:uid(), description:t.description, amount:t.amount, currency:t.currency,
    category:t.category, date:dateStr, notes:'Recurring', recurringId:t.id, createdAt:Date.now()
  });
  saveState(); renderAll(); showToast('✅ Logged '+t.description);
}

/* ============ BUDGETS ============ */
function spentInCategoryThisMonth(catId){
  var mk = currentMonthKey(); var sum=0; var ok=true;
  state.expenses.forEach(function(e){
    if(e.category===catId && monthKey(e.date)===mk){
      var c = toBase(e.amount, e.currency);
      if(c==null) ok=false; else sum+=c;
    }
  });
  return ok ? sum : null;
}
function renderBudgets(container, isSettings){
  var budgets = state.settings.budgets || {};
  var keys = Object.keys(budgets).filter(function(k){ return budgets[k] > 0; });
  if(!isSettings){
    if(keys.length===0){
      container.innerHTML = '<div class="empty"><span class="ic">🎯</span>No budgets set. Add monthly targets per category in Settings to track progress here.</div>';
      return;
    }
    container.innerHTML='';
    keys.forEach(function(catId){
      var ci = catInfo(catId);
      var spent = spentInCategoryThisMonth(catId);
      var budget = budgets[catId];
      var pct = spent==null ? 0 : Math.min(100, (spent/budget)*100);
      var color = spent==null ? 'var(--ink-faint)' : (spent>budget ? 'var(--rose)' : (pct>80 ? 'var(--accent)' : 'var(--teal)'));
      var div = document.createElement('div'); div.className='budget-item';
      div.innerHTML = '<div class="budget-top"><span class="cat">'+ci.icon+' '+ci.label+'</span><span class="amt mono">'+(spent==null?'—':formatMoney(spent, state.settings.baseCurrency))+' / '+formatMoney(budget, state.settings.baseCurrency)+'</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+color+';"></div></div>';
      container.appendChild(div);
    });
  } else {
    container.innerHTML='';
    CATEGORIES.forEach(function(c){
      var row = document.createElement('div'); row.className='field-row'; row.style.alignItems='end'; row.style.marginBottom='10px';
      row.innerHTML = '<div class="field" style="margin-bottom:0;"><label>'+c.icon+' '+c.label+'</label></div>'+
        '<div class="field" style="margin-bottom:0;"><input type="number" min="0" step="any" data-cat="'+c.id+'" class="budgetInput" placeholder="No budget" value="'+(budgets[c.id]||'')+'"></div>';
      container.appendChild(row);
    });
    container.querySelectorAll('.budgetInput').forEach(function(inp){
      inp.addEventListener('change', function(){
        var v = parseFloat(inp.value);
        if(!v || v<=0) delete state.settings.budgets[inp.dataset.cat];
        else state.settings.budgets[inp.dataset.cat] = v;
        saveState(); renderDashboard();
      });
    });
  }
}

/* ============ EXPENSE LIST ============ */
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function getFilteredExpenses(){
  var q = document.getElementById('fSearch').value.trim().toLowerCase();
  var cat = document.getElementById('fCategory').value;
  var cur = document.getElementById('fCurrency').value;
  var mo = document.getElementById('fMonth').value;
  var sort = document.getElementById('fSort').value;
  var list = state.expenses.filter(function(e){
    if(q && !((e.description||'').toLowerCase().includes(q) || (e.notes||'').toLowerCase().includes(q))) return false;
    if(cat && e.category!==cat) return false;
    if(cur && e.currency!==cur) return false;
    if(mo && monthKey(e.date)!==mo) return false;
    return true;
  });
  list.sort(function(a,b){
    if(sort==='date-desc') return b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0);
    if(sort==='date-asc') return a.date.localeCompare(b.date) || (a.createdAt||0)-(b.createdAt||0);
    if(sort==='amount-desc') return (toBase(b.amount,b.currency)||0) - (toBase(a.amount,a.currency)||0);
    if(sort==='amount-asc') return (toBase(a.amount,a.currency)||0) - (toBase(b.amount,b.currency)||0);
    return 0;
  });
  return list;
}
function renderExpenseList(){
  fillCurrencyFilter(document.getElementById('fCurrency'));
  fillMonthFilter(document.getElementById('fMonth'), true);
  var list = getFilteredExpenses();
  var container = document.getElementById('expList');
  if(list.length===0){
    container.innerHTML = '<div class="empty"><span class="ic">📭</span>'+(state.expenses.length===0 ? 'No expenses yet — add your first one.' : 'No expenses match these filters.')+'</div>';
    return;
  }
  container.innerHTML='';
  list.forEach(function(e){
    var ci = catInfo(e.category);
    var row = document.createElement('div'); row.className='exp-row';
    var conv = e.currency!==state.settings.baseCurrency ? toBase(e.amount, e.currency) : null;
    row.innerHTML =
      '<div class="exp-ic">'+ci.icon+'</div>'+
      '<div class="exp-mid"><div class="exp-desc">'+escapeHtml(e.description)+'</div>'+
      '<div class="exp-meta">'+e.date+' · <span class="stamp" style="transform:none;padding:1px 8px;font-size:10px;">'+ci.label+'</span>'+(e.notes?(' · '+escapeHtml(e.notes)):'')+'</div></div>'+
      '<div class="exp-amt"><div class="orig mono">'+formatMoney(e.amount, e.currency)+'</div>'+
      (conv!=null? '<div class="conv mono">≈ '+formatMoney(conv, state.settings.baseCurrency)+'</div>' : '')+'</div>'+
      '<div class="exp-actions"><button class="editB" title="Edit">✏️</button><button class="delB" title="Delete">🗑️</button></div>';
    row.querySelector('.editB').addEventListener('click', function(){ openExpenseModal(e); });
    row.querySelector('.delB').addEventListener('click', function(){ deleteExpense(e.id); });
    container.appendChild(row);
  });
}
function deleteExpense(id){
  if(!confirm('Delete this expense?')) return;
  state.expenses = state.expenses.filter(function(e){ return e.id!==id; });
  saveState(); renderAll(); showToast('Deleted');
}

/* ============ MODAL / ADD-EDIT ============ */
var modal = null, expForm = null;
function initModalRefs(){ modal = document.getElementById('modalOverlay'); expForm = document.getElementById('expForm'); }
function openExpenseModal(existing){
  document.getElementById('modalTitle').textContent = existing ? 'Edit expense' : 'Add expense';
  document.getElementById('expId').value = existing ? existing.id : '';
  document.getElementById('expDesc').value = existing ? existing.description : '';
  document.getElementById('expAmount').value = existing ? existing.amount : '';
  pickers.expCurrency.set(existing ? existing.currency : state.settings.baseCurrency);
  document.getElementById('expDate').value = existing ? existing.date : todayStr();
  fillCategorySelect(document.getElementById('expCategory'), existing ? existing.category : 'other', false);
  document.getElementById('expNotes').value = existing ? (existing.notes||'') : '';
  updateConvertPreview();
  modal.classList.add('open');
  document.getElementById('expDesc').focus();
}
function closeModal(){ modal.classList.remove('open'); }
function updateConvertPreview(){
  var amt = parseFloat(document.getElementById('expAmount').value);
  var cur = pickers.expCurrency.get();
  var wrap = document.getElementById('convertPreviewWrap');
  var pre = document.getElementById('convertPreview');
  if(!amt || cur===state.settings.baseCurrency){ wrap.style.display='none'; return; }
  var c = convert(amt, cur, state.settings.baseCurrency);
  wrap.style.display='block';
  pre.textContent = c!=null ? ('≈ '+formatMoney(c, state.settings.baseCurrency)+' at today\'s rate') : 'Exchange rate not available yet for this currency';
}

/* ============ ANALYTICS ============ */
var chartCategory=null, chartTrend=null;
function renderAnalytics(){
  var mk = currentMonthKey();
  var monthExpenses = state.expenses.filter(function(e){ return monthKey(e.date)===mk; });
  var sum=0, ok=true, byCat={}, byDay={};
  monthExpenses.forEach(function(e){
    var c = toBase(e.amount, e.currency);
    if(c==null){ ok=false; return; }
    sum+=c;
    byCat[e.category] = (byCat[e.category]||0) + c;
    byDay[e.date] = (byDay[e.date]||0) + 1;
  });
  var dayOfMonth = new Date().getDate();
  document.getElementById('anAvg').textContent = ok ? formatMoney(sum/dayOfMonth, state.settings.baseCurrency) : '—';
  var topCat = Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];})[0];
  document.getElementById('anTopCat').textContent = topCat ? (catInfo(topCat).icon+' '+catInfo(topCat).label) : '—';
  var freq={};
  monthExpenses.forEach(function(e){ freq[e.category]=(freq[e.category]||0)+1; });
  var freqCat = Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];})[0];
  document.getElementById('anFreqCat').textContent = freqCat ? (catInfo(freqCat).icon+' '+catInfo(freqCat).label) : '—';
  document.getElementById('anDays').textContent = Object.keys(byDay).length;

  renderCategoryChart(byCat, ok);
  renderTrendChart();
  renderMonthlyReport();
}
function renderCategoryChart(byCat, ok){
  var ctx = document.getElementById('chartCategory').getContext('2d');
  var labels = Object.keys(byCat).map(function(k){ return catInfo(k).icon+' '+catInfo(k).label; });
  var values = Object.keys(byCat).map(function(k){ return byCat[k]; });
  if(chartCategory) chartCategory.destroy();
  if(typeof Chart==='undefined') return;
  if(labels.length===0){
    return;
  }
  var colors = ['#e8b04b','#4fb0a5','#e2685f','#6f9ceb','#c792ea','#f0a868','#7fd1c4','#e78a9a','#a3c25f','#d1a3e0','#8fb8de'];
  chartCategory = new Chart(ctx,{
    type:'doughnut',
    data:{ labels:labels, datasets:[{ data:values, backgroundColor:colors, borderWidth:0 }] },
    options:{ maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ color:getComputedStyle(document.body).getPropertyValue('--ink'), boxWidth:12, font:{size:11} } } } }
  });
}
function renderTrendChart(){
  var months = lastNMonthKeys(6);
  var totals = months.map(function(mk){
    var sum=0, ok=true;
    state.expenses.forEach(function(e){
      if(monthKey(e.date)===mk){
        var c = toBase(e.amount, e.currency);
        if(c==null) ok=false; else sum+=c;
      }
    });
    return ok ? sum : 0;
  });
  var ctx = document.getElementById('chartTrend').getContext('2d');
  if(chartTrend) chartTrend.destroy();
  if(typeof Chart==='undefined') return;
  var ink = getComputedStyle(document.body).getPropertyValue('--ink-dim');
  chartTrend = new Chart(ctx,{
    type:'bar',
    data:{ labels:months.map(function(m){return monthLabel(m).split(' ')[0].slice(0,3);}), datasets:[{ data:totals, backgroundColor:'#e8b04b', borderRadius:6, maxBarThickness:38 }] },
    options:{ maintainAspectRatio:false, plugins:{ legend:{display:false} },
      scales:{ x:{ ticks:{color:ink}, grid:{display:false} }, y:{ ticks:{color:ink}, grid:{color:'rgba(255,255,255,.06)'} } } }
  });
}
function renderMonthlyReport(){
  var sel = document.getElementById('repMonth');
  fillMonthFilter(sel, false);
  document.getElementById('repBaseHead').textContent = 'Amount ('+state.settings.baseCurrency+')';
  var mk = sel.value || currentMonthKey();
  var rows = state.expenses.filter(function(e){ return monthKey(e.date)===mk; }).sort(function(a,b){return a.date.localeCompare(b.date);});
  var body = document.getElementById('repBody');
  var total=0, ok=true;
  if(rows.length===0){
    body.innerHTML = '<tr><td colspan="5" style="color:var(--ink-faint);">No expenses for this month.</td></tr>';
  } else {
    body.innerHTML = rows.map(function(e){
      var c = toBase(e.amount, e.currency);
      if(c==null) ok=false; else total+=c;
      var ci = catInfo(e.category);
      return '<tr><td>'+e.date+'</td><td>'+escapeHtml(e.description)+'</td><td>'+ci.icon+' '+ci.label+'</td><td class="mono">'+formatMoney(e.amount,e.currency)+'</td><td class="mono">'+(c!=null?formatMoney(c,state.settings.baseCurrency):'—')+'</td></tr>';
    }).join('');
  }
  document.getElementById('repTotal').textContent = ok ? formatMoney(total, state.settings.baseCurrency) : '—';
}

/* ============ SETTINGS ============ */
function renderRecurringList(){

function renderRateStatus(){

  } else {

/* ============ TABS ============ */
function switchTab(name){
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===name); });
  document.querySelectorAll('section.view').forEach(function(s){ s.classList.toggle('active', s.id==='view-'+name); });
  if(name==='analytics') renderAnalytics();
}

/* ============ EXPORT / IMPORT ============ */
function downloadBlob(content, filename, type){
  var blob = new Blob([content], {type:type});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function exportCsv(){
  var base = state.settings.baseCurrency;
  var rows = [['Date','Description','Category','Amount','Currency','Amount ('+base+')','Notes']];
  state.expenses.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
    var c = toBase(e.amount, e.currency);
    rows.push([e.date, e.description, catInfo(e.category).label, e.amount, e.currency, c!=null?c.toFixed(2):'', e.notes||'']);
  });
  var csv = rows.map(function(r){
    return r.map(function(v){
      var s = String(v==null?'':v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',');
  }).join('\n');
  downloadBlob(csv, 'expenses-'+todayStr()+'.csv', 'text/csv');
  showToast('📥 CSV exported');
}
function exportJson(){
  downloadBlob(JSON.stringify(state, null, 2), 'ledger-backup-'+todayStr()+'.json', 'application/json');
  showToast('📦 Backup downloaded');
}
function importJsonFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.expenses)) throw new Error('bad shape');
      if(!confirm('This will replace all current data with the backup file. Continue?')) return;
      var d = defaultState();
      state = {
        settings: Object.assign({}, d.settings, parsed.settings||{}),
        expenses: parsed.expenses,
        recurring: Array.isArray(parsed.recurring) ? parsed.recurring : [],
        ratesCache: parsed.ratesCache || null
      };
      saveState();
      syncPickersToState();
      renderAll();
      ensureRates(false);
      showToast('✅ Backup restored');
    }catch(e){ alert('Could not read this file — is it a Ledger backup JSON?'); }
  };
  reader.readAsText(file);
}
function syncPickersToState(){
  var base = state.settings.baseCurrency;
  if(pickers.baseCurrency) pickers.baseCurrency.set(base);
  if(pickers.expCurrency) pickers.expCurrency.set(base);
  if(pickers.cvFrom) pickers.cvFrom.set(base);
  if(pickers.recCurrency) pickers.recCurrency.set(base);
}

/* ============ RENDER ALL ============ */
function renderAll(){
  renderTicker();
  renderDashboard();
  renderExpenseList();
  if(document.getElementById('view-analytics').classList.contains('active')) renderAnalytics();
  renderSettings();
}

/* ============ INIT ============ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.settings.theme);
  document.getElementById('themeToggle').textContent = state.settings.theme==='dark' ? '🌙' : '☀️';
}

function wireEvents(){
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click', function(){ switchTab(b.dataset.tab); });
  });
  document.getElementById('themeToggle').addEventListener('click', function(){
    state.settings.theme = state.settings.theme==='dark' ? 'light' : 'dark';
    applyTheme(); saveState(); renderAnalytics();
  });
  document.getElementById('themeDarkBtn').addEventListener('click', function(){ state.settings.theme='dark'; applyTheme(); saveState(); renderSettings(); renderAnalytics(); });
  document.getElementById('themeLightBtn').addEventListener('click', function(){ state.settings.theme='light'; applyTheme(); saveState(); renderSettings(); renderAnalytics(); });

  document.getElementById('addBtn').addEventListener('click', function(){ openExpenseModal(null); });
  document.getElementById('addBtn2').addEventListener('click', function(){ openExpenseModal(null); });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', function(ev){ if(ev.target===modal) closeModal(); });

  document.getElementById('expAmount').addEventListener('input', updateConvertPreview);

  expForm.addEventListener('submit', function(ev){
    ev.preventDefault();
    var id = document.getElementById('expId').value;
    var payload = {
      description: document.getElementById('expDesc').value.trim(),
      amount: parseFloat(document.getElementById('expAmount').value),
      currency: pickers.expCurrency.get(),
      date: document.getElementById('expDate').value,
      category: document.getElementById('expCategory').value,
      notes: document.getElementById('expNotes').value.trim()
    };
    if(!payload.description || !payload.amount || payload.amount<=0 || !payload.date){
      showToast('⚠️ Please fill in description, amount and date'); return;
    }
    if(id){
      var existing = state.expenses.find(function(e){return e.id===id;});
      Object.assign(existing, payload);
    } else {
      payload.id = uid(); payload.recurringId=null; payload.createdAt=Date.now();
      state.expenses.push(payload);
    }
    saveState(); closeModal(); renderAll(); showToast(id?'✅ Expense updated':'✅ Expense added');
  });

  ['fSearch','fCategory','fCurrency','fMonth','fSort'].forEach(function(id){
    document.getElementById(id).addEventListener('input', renderExpenseList);
    document.getElementById(id).addEventListener('change', renderExpenseList);
  });

  document.getElementById('exportCsv').addEventListener('click', exportCsv);
  document.getElementById('exportJson').addEventListener('click', exportJson);
  document.getElementById('exportJson2').addEventListener('click', exportJson);
  document.getElementById('importJson').addEventListener('change', function(ev){ if(ev.target.files[0]) importJsonFile(ev.target.files[0]); ev.target.value=''; });
  document.getElementById('importJson2').addEventListener('change', function(ev){ if(ev.target.files[0]) importJsonFile(ev.target.files[0]); ev.target.value=''; });

  document.getElementById('clearAllBtn').addEventListener('click', function(){
    if(!confirm('This will permanently delete all expenses, budgets and recurring templates from this browser. Continue?')) return;
    if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
    state = defaultState();
    saveState(); applyTheme(); syncPickersToState(); renderAll(); ensureRates(true);
    showToast('All data cleared');
  });

  document.getElementById('cvAmount').addEventListener('input', renderConverter);
  document.getElementById('cvSwap').addEventListener('click', function(){
    var f = pickers.cvFrom.get(), t = pickers.cvTo.get();
    pickers.cvFrom.set(t); pickers.cvTo.set(f); renderConverter();
  });

  document.getElementById('recAdd').addEventListener('click', function(){
    var desc = document.getElementById('recDesc').value.trim();
    var amount = parseFloat(document.getElementById('recAmount').value);
    var currency = pickers.recCurrency.get();
    var category = document.getElementById('recCategory').value;
    var day = parseInt(document.getElementById('recDay').value,10) || 1;
    if(!desc || !amount || amount<=0){ showToast('⚠️ Enter a description and amount'); return; }
    state.recurring.push({ id:uid(), description:desc, amount:amount, currency:currency, category:category, dayOfMonth:Math.min(Math.max(day,1),28) });
    saveState();
    document.getElementById('recDesc').value=''; document.getElementById('recAmount').value='';
    renderAll(); showToast('✅ Recurring template added');
  });

  document.getElementById('repMonth').addEventListener('change', renderMonthlyReport);
}

function init(){
  initModalRefs();
  applyTheme();

  pickers.expCurrency = buildCurrencyPicker('expCurrency', { value: state.settings.baseCurrency, onChange: updateConvertPreview });
  pickers.cvFrom = buildCurrencyPicker('cvFrom', { value: state.settings.baseCurrency, onChange: renderConverter });
  pickers.cvTo = buildCurrencyPicker('cvTo', { value: state.settings.baseCurrency==='EUR' ? 'USD' : 'EUR', onChange: renderConverter });
  pickers.recCurrency = buildCurrencyPicker('recCurrency', { value: state.settings.baseCurrency });
  pickers.baseCurrency = buildCurrencyPicker('baseCurrencySelect', { value: state.settings.baseCurrency, onChange: function(code){
    state.settings.baseCurrency = code;
    saveState();
    if(pickers.expCurrency) pickers.expCurrency.set(code);
    if(pickers.cvFrom) pickers.cvFrom.set(code);
    if(pickers.recCurrency) pickers.recCurrency.set(code);
    ensureRates(true);
  }});
  fillCategorySelect(document.getElementById('expCategory'), 'other', false);
  fillCategorySelect(document.getElementById('fCategory'), '', true);
  fillCategorySelect(document.getElementById('recCategory'), 'other', false);
  document.getElementById('expDate').value = todayStr();

  wireEvents();
  renderAll();
  ensureRates(false);
}

if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); }
else { init(); }

})();
</script>
</body>
</html>
